<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnyDevice - 跨端设备映射中心</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 30, 46, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.35);
            --secondary: #3b82f6;
            --secondary-glow: rgba(59, 130, 246, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.08), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05), transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            margin: auto 0;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .logo-badge svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Device Mapping Selectors */
        .section-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .device-selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .device-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .device-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .device-card.active {
            background: rgba(16, 185, 129, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.15);
        }

        .device-card.active.mouse-card {
            background: rgba(59, 130, 246, 0.08);
            border-color: var(--secondary);
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.15);
        }

        .device-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .device-icon-box {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-icon-box svg {
            width: 18px;
            height: 18px;
            fill: var(--text-main);
        }

        .device-card.active .device-icon-box {
            background: var(--primary);
        }

        .device-card.active.mouse-card .device-icon-box {
            background: var(--secondary);
        }

        .device-toggle-badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-weight: 600;
        }

        .device-card.active .device-toggle-badge {
            background: var(--primary);
            color: #fff;
        }

        .device-card.active.mouse-card .device-toggle-badge {
            background: var(--secondary);
            color: #fff;
        }

        .device-info-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .device-info-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* Audio Module Area */
        .module-container {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        .module-container.visible {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Visualizer Canvas */
        .visualizer-wrapper {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .canvas-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.75rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Sliders */
        .control-group {
            margin-bottom: 12px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .control-val {
            color: var(--text-main);
            font-weight: 700;
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* Mouse Screen Mirror Canvas */
        .mouse-screen-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: 14px;
            border: 1px solid rgba(59, 130, 246, 0.25);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .virtual-cursor {
            width: 14px;
            height: 14px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-2px, -2px);
            pointer-events: none;
            z-index: 10;
            transition: transform 0.05s linear;
        }

        .virtual-cursor svg {
            width: 100%;
            height: 100%;
            fill: #38bdf8;
            filter: drop-shadow(0 0 6px #38bdf8);
        }

        .click-ripple {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #38bdf8;
            transform: translate(-50%, -50%) scale(0.2);
            opacity: 1;
            pointer-events: none;
            animation: rippleAnim 0.4s ease-out forwards;
        }

        @keyframes rippleAnim {
            to {
                transform: translate(-50%, -50%) scale(2);
                opacity: 0;
            }
        }

        .mouse-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .btn-badge-group {
            display: flex;
            gap: 6px;
        }

        .btn-badge {
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 0.68rem;
            font-weight: 700;
        }

        .btn-badge.active {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 0 6px var(--secondary-glow);
        }

        /* Master Connect Button */
        .main-btn {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 8px 24px var(--primary-glow);
            margin-bottom: 16px;
            transition: all 0.25s ease;
        }

        .main-btn.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.35);
        }

        .main-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4zM2 4v16h20V4zm10 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                </div>
                <div>
                    <div class="title">AnyDevice</div>
                    <div style="font-size: 0.72rem; color: var(--text-muted);">跨端设备映射中心</div>
                </div>
            </div>
            <div class="status-pill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <!-- Master Switch / Connect Button -->
        <button class="main-btn" id="masterBtn">
            <svg id="masterIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span id="masterText">开启设备映射</span>
        </button>

        <!-- Device Selector -->
        <div class="section-title">选择映射到本设备的硬件通道</div>
        <div class="device-selector-grid">
            <!-- Audio Card -->
            <div class="device-card active" id="audioCard">
                <div class="device-header">
                    <div class="device-icon-box">
                        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    </div>
                    <span class="device-toggle-badge" id="audioBadge">已选</span>
                </div>
                <div>
                    <div class="device-info-name">🎧 系统音频</div>
                    <div class="device-info-desc">台式机声音串流到本端</div>
                </div>
            </div>

            <!-- Mouse Card -->
            <div class="device-card mouse-card" id="mouseCard">
                <div class="device-header">
                    <div class="device-icon-box">
                        <svg viewBox="0 0 24 24"><path d="M13 2v8h7V7a5 5 0 0 0-5-5h-2zm-2 0H9a5 5 0 0 0-5 5v3h7V2zm9 10h-7v10h2a5 5 0 0 0 5-5v-5zm-9 10V12H4v5a5 5 0 0 0 5 5h2z"/></svg>
                    </div>
                    <span class="device-toggle-badge" id="mouseBadge">未选</span>
                </div>
                <div>
                    <div class="device-info-name">🖱️ 本地鼠标</div>
                    <div class="device-info-desc">台式机光标映射到本端</div>
                </div>
            </div>
        </div>

        <!-- Audio Module Controls -->
        <div class="module-container visible" id="audioModule">
            <div class="control-header" style="margin-bottom: 6px;">
                <span style="font-weight: 600; color: var(--text-main);">🎧 音频示波器</span>
                <span id="audioStatusText" style="font-size: 0.72rem; color: var(--primary);">48kHz 立体声</span>
            </div>
            <div class="visualizer-wrapper">
                <canvas id="visualizer"></canvas>
                <div class="canvas-overlay" id="canvasHint">声音串流中</div>
            </div>
            <div class="control-group">
                <div class="control-header">
                    <span>音量调节</span>
                    <span class="control-val" id="volVal">100%</span>
                </div>
                <input type="range" id="volSlider" min="0" max="150" value="100">
            </div>
            <div class="control-group" style="margin-bottom: 0;">
                <div class="control-header">
                    <span>缓冲延迟</span>
                    <span class="control-val" id="bufferVal">40 ms</span>
                </div>
                <input type="range" id="bufferSlider" min="15" max="250" value="40" step="5">
            </div>
        </div>

        <!-- Mouse Module Controls -->
        <div class="module-container" id="mouseModule">
            <div class="control-header" style="margin-bottom: 8px;">
                <span style="font-weight: 600; color: var(--text-main);">🖱️ 鼠标屏幕映射画布</span>
                <span id="screenRes" style="font-size: 0.72rem; color: var(--secondary);">1920 × 1080</span>
            </div>
            <div class="mouse-screen-box" id="mouseScreenBox">
                <!-- Virtual Cursor -->
                <div class="virtual-cursor" id="virtualCursor">
                    <svg viewBox="0 0 24 24"><path d="M3 2l10 17 3-6 6-3L3 2z"/></svg>
                </div>
            </div>
            <div class="mouse-info-bar">
                <div id="mouseCoords">坐标: X: 0 | Y: 0</div>
                <div class="btn-badge-group">
                    <span class="btn-badge" id="btnLeft">左键</span>
                    <span class="btn-badge" id="btnMiddle">中键</span>
                    <span class="btn-badge" id="btnRight">右键</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div style="color: var(--primary); display: flex; align-items: center; gap: 4px;">
                <span>🛡️ 屏幕常亮保护中</span>
            </div>
            <div id="clientStatus">在线设备: 1 台</div>
        </div>
    </div>

    <script>
        // State
        let isConnected = false;
        let audioEnabled = true;
        let mouseEnabled = false;
        let ws = null;
        let audioCtx = null;
        let gainNode = null;
        let analyser = null;
        let nextAudioTime = 0;
        let targetBufferMs = 40;
        let wakeLock = null;

        // Elements
        const masterBtn = document.getElementById('masterBtn');
        const masterText = document.getElementById('masterText');
        const masterIcon = document.getElementById('masterIcon');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const audioCard = document.getElementById('audioCard');
        const audioBadge = document.getElementById('audioBadge');
        const mouseCard = document.getElementById('mouseCard');
        const mouseBadge = document.getElementById('mouseBadge');
        const audioModule = document.getElementById('audioModule');
        const mouseModule = document.getElementById('mouseModule');

        // Audio controls
        const volSlider = document.getElementById('volSlider');
        const volVal = document.getElementById('volVal');
        const bufferSlider = document.getElementById('bufferSlider');
        const bufferVal = document.getElementById('bufferVal');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const canvasHint = document.getElementById('canvasHint');

        // Mouse controls
        const mouseScreenBox = document.getElementById('mouseScreenBox');
        const virtualCursor = document.getElementById('virtualCursor');
        const mouseCoords = document.getElementById('mouseCoords');
        const screenRes = document.getElementById('screenRes');
        const btnLeft = document.getElementById('btnLeft');
        const btnMiddle = document.getElementById('btnMiddle');
        const btnRight = document.getElementById('btnRight');
        const clientStatus = document.getElementById('clientStatus');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
            canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Screen WakeLock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }

        // Toggle Device Selection in UI
        audioCard.addEventListener('click', () => {
            audioEnabled = !audioEnabled;
            updateDeviceUI();
            syncMappingSettings();
        });

        mouseCard.addEventListener('click', () => {
            mouseEnabled = !mouseEnabled;
            updateDeviceUI();
            syncMappingSettings();
        });

        function updateDeviceUI() {
            // Audio Card
            if (audioEnabled) {
                audioCard.classList.add('active');
                audioBadge.innerText = '已选';
                audioModule.classList.add('visible');
            } else {
                audioCard.classList.remove('active');
                audioBadge.innerText = '未选';
                audioModule.classList.remove('visible');
            }

            // Mouse Card
            if (mouseEnabled) {
                mouseCard.classList.add('active');
                mouseBadge.innerText = '已选';
                mouseModule.classList.add('visible');
            } else {
                mouseCard.classList.remove('active');
                mouseBadge.innerText = '未选';
                mouseModule.classList.remove('visible');
            }
        }

        function syncMappingSettings() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'set_mapping',
                    audio: audioEnabled,
                    mouse: mouseEnabled
                }));
            }
        }

        // Initialize Web Audio Engine
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext({ sampleRate: 48000 });
                gainNode = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                gainNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                gainNode.gain.value = volSlider.value / 100.0;
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Master Connect / Disconnect
        masterBtn.addEventListener('click', () => {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        });

        function connect() {
            initAudio();
            requestWakeLock();

            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${proto}//${location.host}/ws`;

            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                isConnected = true;
                statusDot.className = 'status-dot connected';
                statusText.innerText = '映射中';
                masterBtn.classList.add('active');
                masterText.innerText = '停止映射服务';
                masterIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                canvasHint.style.opacity = '0';
                syncMappingSettings();
                drawVisualizer();
            };

            ws.onmessage = (event) => {
                // 1. Binary message = Audio PCM Chunk
                if (event.data instanceof ArrayBuffer) {
                    if (audioEnabled) {
                        playAudioChunk(event.data);
                    }
                } 
                // 2. Text message = JSON Mouse Event / Status
                else if (typeof event.data === 'string') {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'mouse' && mouseEnabled) {
                            handleMouseEvent(msg);
                        }
                    } catch (e) {}
                }
            };

            ws.onclose = () => {
                disconnect();
            };

            ws.onerror = () => {
                statusDot.className = 'status-dot error';
                statusText.innerText = '连接出错';
            };
        }

        function disconnect() {
            isConnected = false;
            if (ws) {
                ws.close();
                ws = null;
            }
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
            statusDot.className = 'status-dot';
            statusText.innerText = '未连接';
            masterBtn.classList.remove('active');
            masterText.innerText = '开启设备映射';
            masterIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            canvasHint.style.opacity = '1';
        }

        // Schedule & Play Audio
        function playAudioChunk(arrayBuffer) {
            if (!audioCtx) return;
            const int16 = new Int16Array(arrayBuffer);
            const frameCount = int16.length / 2;
            if (frameCount <= 0) return;

            const audioBuffer = audioCtx.createBuffer(2, frameCount, 48000);
            const left = audioBuffer.getChannelData(0);
            const right = audioBuffer.getChannelData(1);

            for (let i = 0; i < frameCount; i++) {
                left[i] = int16[i * 2] / 32768.0;
                right[i] = int16[i * 2 + 1] / 32768.0;
            }

            const now = audioCtx.currentTime;
            const targetSec = targetBufferMs / 1000.0;

            if (nextAudioTime < now) {
                nextAudioTime = now + targetSec;
            } else if (nextAudioTime > now + targetSec + 0.15) {
                nextAudioTime = now + targetSec;
            }

            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(gainNode);
            source.start(nextAudioTime);

            nextAudioTime += audioBuffer.duration;
        }

        // Handle Real-time Mouse Mapping Event
        function handleMouseEvent(evt) {
            const boxWidth = mouseScreenBox.clientWidth;
            const boxHeight = mouseScreenBox.clientHeight;

            const posX = evt.x * boxWidth;
            const posY = evt.y * boxHeight;

            virtualCursor.style.transform = `translate(${posX}px, ${posY}px)`;

            mouseCoords.innerText = `坐标: X: ${evt.raw_x} | Y: ${evt.raw_y} (${(evt.x * 100).toFixed(1)}%)`;
            screenRes.innerText = `${evt.screen_w} × ${evt.screen_h}`;

            // Buttons State
            btnLeft.classList.toggle('active', evt.left_down);
            btnMiddle.classList.toggle('active', evt.middle_down);
            btnRight.classList.toggle('active', evt.right_down);

            // Create click ripple effect
            if (evt.action === 'down' && evt.left_down) {
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = `${posX}px`;
                ripple.style.top = `${posY}px`;
                mouseScreenBox.appendChild(ripple);
                setTimeout(() => ripple.remove(), 400);
            }
        }

        // Volume slider
        volSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            volVal.innerText = val + '%';
            if (gainNode) gainNode.gain.value = val / 100.0;
        });

        // Buffer slider
        bufferSlider.addEventListener('input', (e) => {
            targetBufferMs = parseInt(e.target.value);
            bufferVal.innerText = targetBufferMs + ' ms';
        });

        // Waveform Animation
        function drawVisualizer() {
            if (!isConnected || !audioEnabled) {
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            requestAnimationFrame(drawVisualizer);

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteTimeDomainData(dataArray);

            canvasCtx.fillStyle = 'rgba(10, 14, 23, 0.4)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.lineWidth = 2.5 * window.devicePixelRatio;
            canvasCtx.strokeStyle = '#10b981';
            canvasCtx.shadowBlur = 8;
            canvasCtx.shadowColor = '#10b981';
            canvasCtx.beginPath();

            const sliceWidth = canvas.width / bufferLength;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = (v * canvas.height) / 2;
                if (i === 0) canvasCtx.moveTo(x, y);
                else canvasCtx.lineTo(x, y);
                x += sliceWidth;
            }
            canvasCtx.stroke();
            canvasCtx.shadowBlur = 0;
        }

        // Heartbeat status poll
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                if (res.ok) {
                    const data = await res.json();
                    clientStatus.innerText = `在线设备: ${data.clients} 台`;
                }
            } catch (e) {}
        }
        setInterval(fetchStatus, 3000);
        fetchStatus();
    </script>
</body>
</html>
