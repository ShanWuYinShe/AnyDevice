# 质量门：与本地「完成前验证」同口径
#   gofmt → go vet → go test → 前端 svelte-check/vite build → Wails 生产构建
#   外加 Windows 双通道：Linux 交叉编译（快速反馈）+ windows runner 真实环境
#   （完整 CGO 编译、全量测试运行、钩子/WASAPI 生命周期测试、服务冒烟）。
#   注意：LL 钩子捕获真实事件与 WASAPI 真实捕获需要交互式会话与音频设备，
#   CI 覆盖的是「真实 Windows 进程内的调用路径不崩溃、不挂死、可反复启停」，
#   端到端听感仍需真机验证。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    # 音频/键鼠捕获依赖 macOS 系统框架，Wails 构建只能在 macOS runner 完成
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: oven-sh/setup-bun@v2

      - name: gofmt 检查
        run: test -z "$(gofmt -l main.go internal/)" || { gofmt -l main.go internal/; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: 前端 svelte-check
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run check

      - name: 前端构建（产物嵌入 internal/web/dist）
        working-directory: frontend
        run: bun run build

      - name: Wails 生产构建
        # UniformTypeIdentifiers 需显式传给链接器（Wails v2.16 darwin 前端引用）
        run: >
          go build -tags "wails,desktop,production"
          -ldflags "-s -w -extldflags '-framework UniformTypeIdentifiers'"
          -o /dev/null main.go

      - name: 打包 AnyDevice.app
        # build.sh 会做：前端构建（幂等）→ .app 组装（Info.plist 注入版本/
        # 许可文本/图标）→ ad-hoc 签名；runner 无 mingw 时自动跳过 Windows 交叉编译
        run: ./scripts/build.sh

      - name: 上传 macOS 包
        uses: actions/upload-artifact@v7
        with:
          name: AnyDevice_macOS_arm64
          path: bin/AnyDevice.app
          retention-days: 14

  windows-cross:
    # Windows 平台层（钩子/SendInput/键码表）为纯 syscall，交叉编译即可验证
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: 交叉编译 Windows 平台层
        run: CGO_ENABLED=0 GOOS=windows go build ./internal/mouse/ ./internal/keyboard/

  linux-build:
    # Linux 原生窗口可行性验证：Wails v2 自带 desktop_linux.go（GTK3 + WebKitGTK），
    # 项目 ui 包的 wails 构建没有 OS 限制。本 job 实测依赖齐全时能否构建出
    # Linux 可执行文件——这是判断「Linux 能否出原生窗口包」的事实依据。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: 安装 GTK/WebKitGTK/Opus 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libopus-dev pkg-config

      - name: 构建 Linux 桌面版（wails 标签）
        run: |
          go build -tags "wails,desktop,production" -o any_device_linux_amd64 main.go
          ls -lh any_device_linux_amd64

      - name: 无窗口冒烟（headless 环境验证服务可启动）
        run: |
          ./any_device_linux_amd64 -no-ui -no-qr -port 18098 &
          APP_PID=$!
          for i in $(seq 1 15); do
            sleep 1
            if curl -sf http://127.0.0.1:18098/api/status > /dev/null; then
              echo "API 200 OK —— Linux 构建产物可正常启动服务"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
          done
          echo "服务未在 15s 内就绪"
          kill $APP_PID 2>/dev/null || true
          exit 1

      - name: 上传 Linux amd64 包
        uses: actions/upload-artifact@v4
        with:
          name: AnyDevice_linux_amd64
          path: any_device_linux_amd64
          retention-days: 14

  linux-build-arm64:
    # 原生 arm64 runner 构建（替代交叉编译：CGO + GTK/WebKitGTK 的多架构
    # 依赖在 amd64 runner 上装不全，原生 runner 更可靠）
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: 安装 GTK/WebKitGTK/Opus 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libopus-dev pkg-config

      - name: 构建 Linux arm64 桌面版
        run: |
          go build -tags "wails,desktop,production" -o any_device_linux_arm64 main.go
          file any_device_linux_arm64
          ls -lh any_device_linux_arm64

      - name: 无窗口冒烟
        run: |
          ./any_device_linux_arm64 -no-ui -no-qr -port 18097 &
          APP_PID=$!
          for i in $(seq 1 15); do
            sleep 1
            if curl -sf http://127.0.0.1:18097/api/status > /dev/null; then
              echo "API 200 OK —— arm64 产物可正常启动服务"
              kill $APP_PID 2>/dev/null || true
              exit 0
            fi
          done
          echo "服务未在 15s 内就绪"
          kill $APP_PID 2>/dev/null || true
          exit 1

      - name: 上传 Linux arm64 包
        uses: actions/upload-artifact@v4
        with:
          name: AnyDevice_linux_arm64
          path: any_device_linux_arm64
          retention-days: 14


  windows-runtime:
    # 真实 Windows 环境：完整 CGO 编译（miniaudio/WASAPI）+ 全量测试运行
    # （含 Opus 回归、键鼠逻辑测试、钩子启停生命周期、WASAPI 线程配对清理）
    # + 服务启停冒烟（-no-ui 起服务 → /api/status 200 → 进程存活 → 清理）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: 确认 MinGW（audio 包 CGO 编译需要）
        # runner 未预装 gcc 时 choco 兜底安装；choco 写的是机器级 PATH，
        # 当前会话不会自动刷新——显式重读 Machine/User PATH 保证后续
        # go build 能找到 gcc
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH", "User")
          }
          gcc --version | Select-Object -First 1

      - name: go vet
        # -unsafeptr=false：Windows 钩子回调的 LPARAM→unsafe.Pointer 是标准
        # 回调模式（指针源自系统调用约定，非 Go 堆指针），vet 无法识别会误报
        run: go vet -unsafeptr=false ./...

      - name: go test（全量，真实 Windows 运行）
        run: go test -count=1 ./...

      - name: 构建
        run: go build -o any_device-smoke.exe main.go

      - name: 服务启停冒烟
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\any_device-smoke.exe" -ArgumentList "-no-ui","-no-qr","-port","18099" -PassThru -WindowStyle Hidden -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Get-Content smoke-out.log, smoke-err.log -ErrorAction SilentlyContinue
            throw "服务进程提前退出（exit=$($p.ExitCode)）"
          }
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:18099/api/status" -UseBasicParsing -TimeoutSec 10
          if ($resp.StatusCode -ne 200) { throw "API 未返回 200" }
          Write-Output "API 200 OK，进程存活 —— Start 路径（含钩子安装/引擎初始化）在真实 Windows 正常"
          Stop-Process -Id $p.Id -Force
          Write-Output "冒烟通过"

      - name: 打包 Windows 版（Wails + Portable）
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' main.go)
          BUILD_TIME=$(date +%Y%m%d-%H%M)
          LDFLAGS="-s -w -X any_device/internal/util.BuildTime=${BUILD_TIME}"
          OUT="AnyDevice_${VERSION}_windows_amd64"
          mkdir -p "$OUT"
          # Wails 版：无控制台窗口（WebView2 前端为纯 Go，cgo 仅 audio 包需要）
          CGO_ENABLED=1 CC=gcc GOOS=windows GOARCH=amd64 \
            go build -tags "wails,desktop,production" -ldflags "$LDFLAGS -H=windowsgui" \
            -o "$OUT/any_device.exe" main.go
          # Portable 回退版：浏览器 --app 窗口壳，控制台可见便于排查
          CGO_ENABLED=1 CC=gcc GOOS=windows GOARCH=amd64 \
            go build -ldflags "$LDFLAGS" \
            -o "$OUT/any_device_portable.exe" main.go
          ls -lh "$OUT"

      - name: 上传 Windows 包
        uses: actions/upload-artifact@v7
        with:
          name: AnyDevice_windows_amd64
          path: AnyDevice_*_windows_amd64/
          retention-days: 14
